name: Defeito
description: Relate um erro encontrado
title: 'fix: '
labels: ['defeito']
body:
  - type: input
    id: versao
    attributes:
      label: Versão / ambiente
      description: 'Tag do site publicado (ex.: "v1.0.0") ou data da publicação, e navegador/dispositivo'
